name            = "mytaskmyhabit-worker"
main            = "src/index.js"
compatibility_date = "2025-01-01"

# ── Cron triggers ─────────────────────────────────────────────────────────────
# Se ejecuta cada 15 min. El Worker comprueba internamente si la hora actual
# en Europe/Madrid cae en la ventana DIGEST_HORA … DIGEST_HORA+14 min.
# Esto garantiza la entrega a las 08:30 Madrid independientemente del DST.
[triggers]
crons = ["*/15 * * * *"]

# ── Variables no sensibles ────────────────────────────────────────────────────
[vars]
SUPABASE_URL        = "https://clpowitmhoibiuszetpg.supabase.co"
SENDGRID_FROM_EMAIL = ""          # ej. tareas@midominio.com (opcional)
# Clave pública VAPID (P-256 uncompressed, base64url, 65 bytes → 87 chars).
# Generar con: node task-worker/scripts/generate-vapid-keys.mjs
VAPID_PUBLIC_KEY    = ""          # sustituir con el valor del script
# Hora de envío del resumen diario en Europe/Madrid (formato HH:MM).
# Para probar: cambiar temporalmente a "unos minutos más adelante" y hacer wrangler deploy.
# Para restaurar: volver a "08:30" y redesplegar.
DIGEST_HORA         = "08:30"

# ── Secrets — añadir con: npx wrangler secret put <NAME> ─────────────────────
# JWT_SECRET                — clave HMAC para firmar/verificar tokens JWT
# AUTH_USERS                — JSON: [{"username":"tony","password_hash":"..."}]
# SUPABASE_SERVICE_ROLE_KEY — service-role key de Supabase (bypasa RLS)
# SUPABASE_JWT_SECRET       — Legacy JWT Secret de Supabase (Settings → API → JWT Settings)
#                             Se usa para firmar tokens de Realtime (GET /auth/realtime-token)
#                             Configurar con: npx wrangler secret put SUPABASE_JWT_SECRET
# WEBHOOK_SECRET            — token de autenticación del email webhook
# SENDGRID_API_KEY          — API key de SendGrid (opcional, para notificaciones)
# VAPID_PRIVATE_KEY_JWK     — Clave privada VAPID como JWK JSON (ES256, P-256)
#                             Generar con: node task-worker/scripts/generate-vapid-keys.mjs
#                             Configurar con: npx wrangler secret put VAPID_PRIVATE_KEY_JWK
# VAPID_SUBJECT             — Identidad VAPID: "mailto:tu-email@dominio.com"
#                             Configurar con: npx wrangler secret put VAPID_SUBJECT
